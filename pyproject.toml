# -- Bump My Version ---------------------------------------------------------------
# This manages the RELEASE_VERSION in _component_info_.py
# The orchestrator workflow calls: bump-my-version bump patch|minor|major
[tool.bumpversion]
current_version = "1.29.0"
commit = true
tag = true
tag_name = "v{new_version}"
commit_message = "bump: Honeybee-PH {current_version} -> {new_version} [skip ci]"

[[tool.bumpversion.files]]
filename = "honeybee_ph_rhino/_component_info_.py"
search = 'RELEASE_VERSION = "Honeybee-PH v{current_version}"'
replace = 'RELEASE_VERSION = "Honeybee-PH v{new_version}"'

# -- Code Quality ------------------------------------------------------------------
[tool.black]
line-length = 120
# Grasshopper rewrites these component facades when they are scraped from GH.
extend-exclude = '^/honeybee_grasshopper_ph/'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
# Grasshopper rewrites these component facades when they are scraped from GH.
extend_skip_glob = ["honeybee_grasshopper_ph/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ignore specific rules that are problematic for Python 2.7 compatibility
ignore = [
    "F401", # Imported but unused (common with type hints in comments for Python 2.7)
]

[tool.ruff.lint.per-file-ignores]
# Allow wildcard imports in __init__.py files
"__init__.py" = ["F403", "F405"]
