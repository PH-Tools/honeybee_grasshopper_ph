name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - name: black
        run: python -m black --check --diff .
      - name: isort
        run: python -m isort --check-only --diff .
